# Application Name & Port
spring.application.name=monthly-expense-tracker
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/expensetracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root

# Read MySQL password from the DBPASSWORD environment variable.
# If DBPASSWORD is not set in the environment, it defaults to empty string.
spring.datasource.password=963696

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Configuration
# 'update' automatically updates the schema in MySQL according to our Entity definitions
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open-in-view setting
spring.jpa.open-in-view=false
